# Infrastructure only. The backend runs locally with `uvicorn --reload`
# against these published ports, so there is one way to run it and no image
# to rebuild on every code change. Deployment uses backend/Dockerfile.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pr_reviewer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    # Pinned, not :latest. The client library checks that its version is
    # close to the server's, so a floating server tag eventually drifts far
    # enough to start warning (or breaking) with no change on our side.
    image: qdrant/qdrant:v1.15.1
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data:
